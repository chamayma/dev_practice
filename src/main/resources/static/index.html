<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        button:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .book-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f1f1f1; margin-bottom: 5px; border-radius: 4px; }
        .book-actions button { padding: 5px 10px; font-size: 12px; }
        #countDisplay { font-weight: bold; color: #28a745; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- CREATE SECTION -->
    <div class="section">
        <h2>Create / Update Book</h2>
        <form id="bookForm">
            <input type="hidden" id="bookId"> <!-- Used for updates -->
            <div class="form-group">
                <label for="bookName">Book Name:</label>
                <input type="text" id="bookName" required>
            </div>
            <div class="form-group">
                <label for="authorId">Author ID (Optional):</label>
                <input type="number" id="authorId">
            </div>
            <div class="form-group">
                <label for="authorName">Author Name:</label>
                <input type="text" id="authorName">
            </div>
            <button type="submit" id="submitBtn" class="btn-success">Create Book</button>
            <button type="button" id="cancelUpdateBtn" style="display:none;" onclick="resetForm()">Cancel Update</button>
        </form>
    </div>

    <!-- COUNT & SEARCH SECTION -->
    <div class="section">
        <h2>Tools</h2>
        <button id="countBtn">Count Total Books</button>
        <span id="countDisplay"></span>
        
        <div style="margin-top: 15px;">
            <input type="text" id="searchInput" placeholder="Search book by keyword..." style="width: 60%; display: inline-block;">
            <button id="searchBtn">Search</button>
        </div>
    </div>

    <!-- READ SECTION (LIST) -->
    <div class="section">
        <h2>All Books</h2>
        <button id="loadBooksBtn">Read all books</button>
        <div id="booksDisplay" style="margin-top: 15px;"></div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    
    const API_URL = 'http://localhost:9090/api/v1/books';

    // --- 1. CREATE / UPDATE (POST / PUT request) ---
    const form = document.getElementById('bookForm');
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        const id = document.getElementById('bookId').value;
        const bookName = document.getElementById('bookName').value;
        const authorId = document.getElementById('authorId').value;
        const authorName = document.getElementById('authorName').value;

        // Build the payload
        const bookPayload = { bookName: bookName };
        if (authorId || authorName) {
            bookPayload.author = {};
            if (authorId) bookPayload.author.id = parseInt(authorId);
            if (authorName) bookPayload.author.name = authorName;
        }

        const isUpdate = id !== "";
        const method = isUpdate ? 'PUT' : 'POST';
        const url = isUpdate ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookPayload)
        })
        .then(response => response.json())
        .then(data => {
            alert(isUpdate ? 'Book updated!' : 'Book created!');
            resetForm();
            loadBooks(); // Refresh list
        })
        .catch(error => console.error('Error saving book:', error));
    });

    // --- 2. READ (GET all) ---
    document.getElementById('loadBooksBtn').addEventListener('click', loadBooks);

    function loadBooks() {
        fetch(API_URL)
        .then(response => response.json())
        .then(data => displayBooks(data))
        .catch(error => console.error('Error fetching books:', error));
    }

    function displayBooks(books) {
        const display = document.getElementById('booksDisplay');
        display.innerHTML = '';
        
        if (books.length === 0) {
            display.innerHTML = '<p>No books found.</p>';
            return;
        }

        books.forEach(book => {
            const authorText = book.author ? ` (Author: ${book.author.name || book.author.id})` : '';
            
            const div = document.createElement('div');
            div.className = 'book-item';
            div.innerHTML = `
                <div>
                    <strong>ID: ${book.id}</strong> | ${book.bookName} ${authorText}
                </div>
                <div class="book-actions">
                    <button onclick="editBook(${book.id}, '${book.bookName}', ${book.author?.id || "''"}, '${book.author?.name || ""}')">Edit</button>
                    <button class="btn-danger" onclick="deleteBook(${book.id})">Delete</button>
                </div>
            `;
            display.appendChild(div);
        });
    }

    // --- 3. UPDATE PREP ---
    window.editBook = function(id, name, authorId, authorName) {
        document.getElementById('bookId').value = id;
        document.getElementById('bookName').value = name;
        document.getElementById('authorId').value = authorId;
        document.getElementById('authorName').value = authorName;
        
        document.getElementById('submitBtn').textContent = 'Update Book';
        document.getElementById('cancelUpdateBtn').style.display = 'inline-block';
        window.scrollTo(0, 0);
    };

    window.resetForm = function() {
        form.reset();
        document.getElementById('bookId').value = '';
        document.getElementById('submitBtn').textContent = 'Create Book';
        document.getElementById('cancelUpdateBtn').style.display = 'none';
    };

    // --- 4. DELETE ---
    window.deleteBook = function(id) {
        if (!confirm('Are you sure you want to delete this book?')) return;

        fetch(`${API_URL}/${id}`, {
            method: 'DELETE'
        })
        .then(() => {
            alert('Book deleted!');
            loadBooks();
        })
        .catch(error => console.error('Error deleting book:', error));
    };

    // --- 5. COUNT ---
    document.getElementById('countBtn').addEventListener('click', function() {
        fetch(`${API_URL}/count`)
        .then(response => response.json())
        .then(count => {
            document.getElementById('countDisplay').textContent = `Total: ${count}`;
        })
        .catch(error => console.error('Error counting books:', error));
    });

    // --- 6. SEARCH ---
    document.getElementById('searchBtn').addEventListener('click', function() {
        const keyword = document.getElementById('searchInput').value;
        if (!keyword) {
            loadBooks();
            return;
        }

        fetch(`${API_URL}/search/${keyword}`)
        .then(response => response.json())
        .then(data => displayBooks(data))
        .catch(error => console.error('Error searching books:', error));
    });

});
</script>

</body>
</html>
